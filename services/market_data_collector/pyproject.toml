[tool.poetry]
name = "market-data-collector"
version = "0.1.0"
description = "Skill 1: Binance market data collection service (REST backfill + WS live streaming)"
authors = ["you"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
python-binance = "^1.0.19"
asyncpg = "^0.29.0"
sqlalchemy = "^2.0.30"
python-dotenv = "^1.0.1"
websockets = "^12.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
